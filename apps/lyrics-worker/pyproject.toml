[project]
name = "partyroom-lyrics-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "partyroom-activity-worker",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "qwen-asr==0.0.6",
  "torch==2.9.1",
  "torchaudio==2.9.1",
  "uvicorn==0.35.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
partyroom-activity-worker = { path = "../../packages/activity-worker-python" }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
