[project]
name = "partyroom-lyrics-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "partyroom-activity-worker",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "py3langid==0.3.0",
  "qwen-asr==0.0.6; sys_platform != 'darwin'",
  "scipy==1.18.0",
  "soundfile==0.14.0",
  "torch==2.9.1; sys_platform != 'darwin'",
  "torchaudio==2.9.1; sys_platform != 'darwin'",
  "uvicorn==0.35.0",
]

[dependency-groups]
mac = [
  "mlx-qwen3-asr[aligner]==0.3.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
partyroom-activity-worker = { path = "../../packages/activity-worker-python" }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
