[project]
name = "partyroom-stem-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "uvicorn==0.35.0",
  "partyroom-activity-worker",
]

[project.optional-dependencies]
nvidia = [
  "audio-separator[gpu]==0.44.5; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torch==2.9.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
mac = [
  "audio-separator[cpu]==0.44.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-audio-separator[convert]==0.1.7; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv]
package = false
conflicts = [
  [
    { extra = "nvidia" },
    { group = "mac" },
  ],
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
partyroom-activity-worker = { path = "../../packages/activity-worker-python" }
torch = { index = "pytorch-cu128", extra = "nvidia" }
