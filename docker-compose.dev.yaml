services:
  mailpit:
    image: axllent/mailpit:v1.32.0
    profiles: [mailpit]
    command: ["--max", "100", "--max-age", "1d", "--disable-version-check", "--smtp-allowed-recipients", "(?i)^[^@]+@[^@]+\\.test$"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 6

  # Keep Vite on the host for HMR; the production web image is built by the base stack only.
  web:
    profiles:
      - production

  backend:
    labels:
      partyroom.dev.mode: docker
    ports:
      - "${PORT:-3210}:3210"
      - "${SITE_PROXY_PORT:-3211}:3211"

  dashboard:
    ports:
      - "${DASHBOARD_PORT:-6791}:6791"

  media-worker:
    ports:
      - "${MEDIA_WORKER_PORT:-4100}:4100"

  stem-worker:
    ports:
      - "${STEM_WORKER_PORT:-4200}:4200"

  lyrics-worker:
    ports:
      - "${LYRICS_WORKER_PORT:-4300}:4300"

  annotations-worker:
    ports:
      - "${ANNOTATIONS_WORKER_PORT:-4400}:4400"

  metadata-worker:
    ports:
      - "127.0.0.1:${METADATA_WORKER_PORT:-4500}:4500"
