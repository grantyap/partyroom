name: Production release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: partyroom-production-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      vars.PRODUCTION_RELEASE_ENABLED == 'true' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, partyroom-production]
    environment: production
    timeout-minutes: 45
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
      SMOKE_ORIGIN: ${{ vars.SMOKE_ORIGIN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Skip superseded commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$RELEASE_SHA"
      - name: Install smoke dependencies
        run: bun install --frozen-lockfile
      - name: Pin, deploy, and verify commit
        env:
          COOLIFY_READ_TOKEN: ${{ secrets.COOLIFY_READ_TOKEN }}
          COOLIFY_WRITE_TOKEN: ${{ secrets.COOLIFY_WRITE_TOKEN }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: python3 scripts/release_coolify.py
      - name: Check production topology
        run: python3 scripts/check_production.py "$COOLIFY_APPLICATION_UUID" --origin "$SMOKE_ORIGIN"
      - name: Check authenticated room creation
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: node scripts/check-room-creation-unattended.mjs
