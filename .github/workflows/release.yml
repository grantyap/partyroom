name: Production release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: partyroom-production-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      vars.PRODUCTION_RELEASE_ENABLED == 'true' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
      SMOKE_ORIGIN: ${{ vars.SMOKE_ORIGIN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Skip superseded commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$RELEASE_SHA"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install smoke dependencies
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Pin, deploy, and verify commit
        env:
          COOLIFY_READ_TOKEN: ${{ secrets.COOLIFY_READ_TOKEN }}
          COOLIFY_WRITE_TOKEN: ${{ secrets.COOLIFY_WRITE_TOKEN }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: python3 scripts/release_coolify.py
      - name: Check deployment host
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_HOST_SSH_KEY: ${{ secrets.DEPLOY_HOST_SSH_KEY }}
          DEPLOY_HOST_KNOWN_HOSTS: ${{ secrets.DEPLOY_HOST_KNOWN_HOSTS }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9_.-]+@[a-zA-Z0-9_.-]+$ ]]
          [[ "$COOLIFY_APPLICATION_UUID" =~ ^[a-z0-9]+$ ]]
          [[ "$SMOKE_ORIGIN" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_HOST_SSH_KEY" > ~/.ssh/release_key
          printf '%s\n' "$DEPLOY_HOST_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/release_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/release_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$DEPLOY_HOST" \
            "python3 - '$COOLIFY_APPLICATION_UUID' --origin '$SMOKE_ORIGIN'" < scripts/check_production.py
      - name: Check authenticated room creation
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: node scripts/check-room-creation-unattended.mjs
