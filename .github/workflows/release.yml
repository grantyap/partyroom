name: Production release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: partyroom-production-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      vars.PRODUCTION_RELEASE_ENABLED == 'true' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
      SMOKE_ORIGIN: ${{ vars.SMOKE_ORIGIN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Skip superseded commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$RELEASE_SHA"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install smoke dependencies
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Join private network
        uses: ./.github/actions/zerotier
        with:
          network_id: ${{ secrets.ZEROTIER_NETWORK_ID }}
          auth_token: ${{ secrets.ZEROTIER_CENTRAL_TOKEN }}
      - name: Pin, deploy, and verify commit
        env:
          COOLIFY_READ_TOKEN: ${{ secrets.COOLIFY_READ_TOKEN }}
          COOLIFY_WRITE_TOKEN: ${{ secrets.COOLIFY_WRITE_TOKEN }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: python3 scripts/release_coolify.py
      - name: Check production topology
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          SSH_JUMP_HOST: ${{ secrets.PRODUCTION_SSH_JUMP_HOST }}
          SSH_JUMP_USER: ${{ secrets.PRODUCTION_SSH_JUMP_USER }}
          SSH_JUMP_KEY: ${{ secrets.PRODUCTION_SSH_JUMP_KEY }}
        run: |
          [[ "$COOLIFY_APPLICATION_UUID" =~ ^[a-z0-9]+$ && "$SMOKE_ORIGIN" =~ ^https://[a-zA-Z0-9.-]+$ ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$SSH_PORT" =~ ^[0-9]+$ && "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$SSH_JUMP_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$SSH_JUMP_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/target_key"
          printf '%s\n' "$SSH_JUMP_KEY" > "$ssh_dir/jump_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir"/*
          printf 'Host jump\n HostName %s\n User %s\n IdentityFile %s/jump_key\nHost target\n HostName %s\n User %s\n Port %s\n IdentityFile %s/target_key\n ProxyJump jump\nHost *\n BatchMode yes\n IdentitiesOnly yes\n StrictHostKeyChecking yes\n UserKnownHostsFile %s/known_hosts\n' \
            "$SSH_JUMP_HOST" "$SSH_JUMP_USER" "$ssh_dir" "$SSH_HOST" "$SSH_USER" "$SSH_PORT" "$ssh_dir" "$ssh_dir" > "$ssh_dir/config"
          ssh -F "$ssh_dir/config" target \
            python3 - "$COOLIFY_APPLICATION_UUID" --origin "$SMOKE_ORIGIN" < scripts/check_production.py
      - name: Check authenticated room creation
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: node scripts/check-room-creation-unattended.mjs
